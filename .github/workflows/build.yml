name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project GeoStampCam.xcodeproj \
            -scheme GeoStampCam \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            clean build | tee build.log
      - name: Package ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GeoStampCam.app Payload/
          zip -qr GeoStampCam.ipa Payload
      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: GeoStampCam-ipa
          path: GeoStampCam.ipa
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
